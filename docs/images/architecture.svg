<circle cx="767" cy="270" r="11" fill="#EC1218"/><text class="bn" x="767" y="274" text-anchor="middle">9</text>
<line x1="820" y1="325" x2="715" y2="325" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="767" cy="325" r="11" fill="#EC1218"/><text class="bn" x="767" y="329" text-anchor="middle">10</text>
<line x1="250" y1="650" x2="345" y2="650" stroke="#000" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/>
<circle cx="297" cy="650" r="11" fill="#EC1218"/><text class="bn" x="297" y="654" text-anchor="middle">5</text>
<line x1="250" y1="400" x2="345" y2="330" stroke="#000" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/>
<circle cx="297" cy="365" r="11" fill="#EC1218"/><text class="bn" x="297" y="369" text-anchor="middle">4</text>
<line x1="530" y1="360" x2="530" y2="400" stroke="#000" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/>
<circle cx="560" cy="380" r="11" fill="#EC1218"/><text class="bn" x="560" y="384" text-anchor="middle">2</text>
<line x1="530" y1="550" x2="530" y2="590" stroke="#000" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/>
<circle cx="560" cy="570" r="11" fill="#EC1218"/><text class="bn" x="560" y="574" text-anchor="middle">8</text>
<line x1="1020" y1="610" x2="1020" y2="650" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="1050" cy="630" r="11" fill="#EC1218"/><text class="bn" x="1050" y="634" text-anchor="middle">7</text>
<text x="262" y="132" font-size="10" font-weight="700" fill="#B30005">export</text>
<text x="262" y="345" font-size="10" font-weight="700" fill="#B30005">sign in · chat</text>
<text x="262" y="672" font-size="10" font-weight="700" fill="#B30005">replicate</text>
<text x="748" y="134" font-size="10" font-weight="700" fill="#B30005">publish KB</text>
<text x="748" y="206" font-size="10" font-weight="700" fill="#B30005">RAG · context · LLM</text>
<text x="748" y="254" font-size="10" font-weight="700" fill="#B30005">tools/invoke</text>
<text x="748" y="343" font-size="10" font-weight="700" fill="#B30005">MCP call_tool</text>
