<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 750" width="1240" height="750" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<style>.t{fill:#000;font-size:13px;font-weight:700}.s{fill:#555;font-size:11px}.h{fill:#000;font-size:12px;font-weight:800;letter-spacing:1.6px}.hw{fill:#fff;font-size:12px;font-weight:800;letter-spacing:1.6px}.box{fill:#fff;stroke:#D2D5D9;stroke-width:1.2}.bn{fill:#fff;font-size:12px;font-weight:800}</style></defs>
<rect width="1240" height="750" fill="#fff"/>
<text x="20" y="38" font-size="20" font-weight="800" fill="#000">Couchbase OneChat</text><text x="262" y="38" font-size="13" fill="#555">one chatbot for customers, prospects and team members</text>
<rect x="20" y="70" width="230" height="200" rx="18" fill="#FFF0DA" stroke="#FBCE90"/><text class="h" x="36" y="96">SYSTEMS OF RECORD</text>
<rect class="box" x="36" y="110" width="198" height="70" rx="12"/><text class="t" x="50" y="134">Nightly export</text><text class="s" x="50" y="153">exportTime=YYYYMMDD/</text><text class="s" x="50" y="168">customers · prospects · team</text>
<rect class="box" x="36" y="190" width="198" height="66" rx="12"/><text class="t" x="50" y="214">Live lookups</text><text class="s" x="50" y="233">CDP / CRM / HRIS profile</text><text class="s" x="50" y="248">CMS: Help Center, Handbook</text>
<rect x="20" y="330" width="230" height="400" rx="30" fill="#000"/><text class="hw" x="40" y="360">ONECHAT APP</text>
<rect class="box" x="36" y="376" width="198" height="120" rx="12"/><text class="t" x="50" y="400">Expo / React Native</text><text class="s" x="50" y="419">Chat · For You · Activity · Profile</text><text class="s" x="50" y="434">renders from the device</text><text class="s" x="50" y="449">3 audiences, one app</text>
<rect class="box" x="36" y="508" width="198" height="206" rx="12"/><text class="t" x="50" y="532">Couchbase Lite</text><text class="s" x="50" y="551">profiles · feed · activity</text><text class="s" x="50" y="566">requests (offline queue)</text><text class="s" x="50" y="581">chat · context_cache · catalog</text><text class="s" x="50" y="596"></text><text class="s" x="50" y="611">channels: user:&lt;id&gt;, catalog,</text><text class="s" x="50" y="626">employees (team only)</text><text class="s" x="50" y="641"></text><text class="s" x="50" y="656">answers offline from the phone</text>
<rect x="320" y="70" width="420" height="660" rx="18" fill="#F7F7F7" stroke="#D2D5D9"/><text class="h" x="340" y="96">DEMO STACK</text>
<rect class="box" x="345" y="110" width="370" height="250" rx="12"/><text class="t" x="359" y="134">Backend · FastAPI</text>
<rect class="box" x="360" y="145" width="165" height="60" rx="12"/><text class="t" x="374" y="169">Loader</text><text class="s" x="374" y="188">export → profiles, feed, KB</text>
<rect class="box" x="535" y="145" width="165" height="60" rx="12"/><text class="t" x="549" y="169">Assistant · /api/chat</text><text class="s" x="549" y="188">intent → gate → RAG / context</text>
<rect class="box" x="360" y="215" width="165" height="60" rx="12"/><text class="t" x="374" y="239">Worker</text><text class="s" x="374" y="258">requests → tools/invoke</text>
<rect class="box" x="535" y="215" width="165" height="60" rx="12"/><text class="t" x="549" y="239">Returns Agent</text><text class="s" x="549" y="258">Agent Memory + 5 tools</text>
<rect class="box" x="360" y="285" width="340" height="60" rx="12"/><text class="t" x="374" y="309">MCP server · onechat-services  (/oc/mcp)</text><text class="s" x="374" y="328">22 tools: orders, returns, cart, leads, IT, HR, onboarding</text>
<rect class="box" x="345" y="400" width="370" height="150" rx="12"/><text class="t" x="359" y="424">Couchbase Server</text><text class="s" x="359" y="443">bucket onechat · scope oc</text><text class="s" x="359" y="458">profiles · feed · activity · requests · chat</text><text class="s" x="359" y="473">context_cache · catalog   (synced to phones)</text><text class="s" x="359" y="488">inventory · lookups   (server only)</text>
<rect class="box" x="345" y="590" width="370" height="120" rx="12"/><text class="t" x="359" y="614">Sync Gateway</text><text class="s" x="359" y="633">per-collection sync functions</text><text class="s" x="359" y="648">user:&lt;id&gt; · catalog · employees channels</text><text class="s" x="359" y="663">session auth minted at sign-in</text>
<rect x="820" y="70" width="400" height="540" rx="18" fill="#fff" stroke="#EC1218" stroke-width="2"/><rect x="820" y="70" width="400" height="36" rx="18" fill="#EC1218"/><rect x="820" y="90" width="400" height="16" fill="#EC1218"/><text class="hw" x="840" y="94">COUCHBASE LABS AGENT OPERATIONS MANAGER</text>
<rect class="box" x="840" y="122" width="175" height="105" rx="12"/><text class="t" x="854" y="146">Knowledge Base</text><text class="s" x="854" y="165">Help Center</text><text class="s" x="854" y="180">Team Handbook</text><text class="s" x="854" y="195">one profile per person</text>
<rect class="box" x="1025" y="122" width="175" height="105" rx="12"/><text class="t" x="1039" y="146">RAG Applications</text><text class="s" x="1039" y="165">onechat-assistant</text><text class="s" x="1039" y="180">onechat-workplace</text><text class="s" x="1039" y="195">scoped per audience</text>
<rect class="box" x="840" y="239" width="175" height="105" rx="12"/><text class="t" x="854" y="263">Context Cache</text><text class="s" x="854" y="282">per person + intent</text><text class="s" x="854" y="297">built once, reused,</text><text class="s" x="854" y="312">invalidated on change</text>
<rect class="box" x="1025" y="239" width="175" height="105" rx="12"/><text class="t" x="1039" y="263">LLM Cache</text><text class="s" x="1039" y="282">shared for policy answers</text><text class="s" x="1039" y="297">exact + semantic hits</text><text class="s" x="1039" y="312">per-prompt for personal</text>
<rect class="box" x="840" y="356" width="175" height="105" rx="12"/><text class="t" x="854" y="380">Governed tools</text><text class="s" x="854" y="399">RBAC · tool scope</text><text class="s" x="854" y="414">trace + audit</text><text class="s" x="854" y="429">tools/invoke</text>
<rect class="box" x="1025" y="356" width="175" height="105" rx="12"/><text class="t" x="1039" y="380">Approvals</text><text class="s" x="1039" y="399">issue_goodwill_credit</text><text class="s" x="1039" y="414">request_privileged_access</text><text class="s" x="1039" y="429">human in the loop</text>
<rect class="box" x="840" y="473" width="360" height="120" rx="12"/><text class="t" x="854" y="497">Agent identities + Agent Memory</text><text class="s" x="854" y="516">OneChat Assistant: all 22 tools</text><text class="s" x="854" y="531">OneChat Returns Agent: 5 tools, remembers each customer</text><text class="s" x="854" y="546">memories recalled on later turns</text>
<rect class="box" x="820" y="650" width="400" height="80" rx="12"/><text class="t" x="834" y="674">LLM provider</text><text class="s" x="834" y="693">called only on a cache miss</text>
<line x1="250" y1="150" x2="345" y2="150" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="297" cy="150" r="11" fill="#EC1218"/><text class="bn" x="297" y="154" text-anchor="middle">1</text>
<line x1="715" y1="150" x2="820" y2="150" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="767" cy="150" r="11" fill="#EC1218"/><text class="bn" x="767" y="154" text-anchor="middle">3</text>
