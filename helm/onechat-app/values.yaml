# Couchbase OneChat mobile demo.
#
# Two images are built from this repository (see deploy/k8s/deploy.sh, which
# builds them and imports them into K3s's containerd so no registry is needed):
#   onechat-backend  <- ./backend
#   onechat-web      <- ./web   (prebuilt Expo web export in web/dist.tgz)

global:
  # Prefixed to the two custom image repositories if set (e.g. a registry host).
  imageRegistry: ""

# Host name or IP that phones and browsers use to reach this cluster's
# LoadBalancer ports. Used for the Sync Gateway URL handed to Couchbase Lite.
publicHost: "192.168.111.4"

# Node IPs to publish the public Services on through kube-proxy. Needed when
# the cluster has no LoadBalancer implementation (K3s with ServiceLB disabled,
# or a Rancher-provisioned cluster): the Services then answer on these IPs at
# their own ports (8083, 8202, 4988) instead of staying <pending>.
externalIPs: []

couchbase:
  image: couchbase:enterprise-8.0.2
  username: Administrator
  # Blank = generated on first install and kept across upgrades.
  password: ""
  bucket: onechat
  scope: oc
  ramQuotaMB:
    data: 1280
    index: 512
    bucket: 1024
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }
  persistence:
    size: 10Gi
    storageClassName: ""

syncGateway:
  image: couchbase/sync-gateway:4.0.4-enterprise
  database: onechat
  service:
    # Phones replicate with ws://<publicHost>:<port>/onechat
    type: LoadBalancer
    port: 4988
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

backend:
  image:
    repository: onechat-backend
    tag: latest
    pullPolicy: IfNotPresent
  # Optional outside access to the API (native app builds, /api/status, /docs).
  # The browser app doesn't need it: the web pod proxies /api to the backend.
  service:
    type: LoadBalancer
    port: 8202
  # Blank = generated on first install and kept across upgrades.
  appSecret: ""
  env:
    KB_PROFILE_LIMIT: "150"
    EXPORT_POLL_SECONDS: "300"
    DEMO_TODAY: ""
  extraEnv: []
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 1536Mi }

# The Couchbase Agent Operations Manager this backend registers with
# (AOM_AUTO_REGISTER): its MCP server, the "OneChat Assistant" agent, the
# approval tier for goodwill credits and privileged access, and the two OneChat RAG
# application. On a fresh AOM, adminPassword becomes AOM's admin password.
aom:
  enabled: true
  # The in-cluster AOM API (the agent-ops chart with fullnameOverride: aom).
  url: https://aom-operations-manager.agent-ops.svc.cluster.local:8090
  # Where AOM reaches this demo's MCP server (it ingests the tools from here and
  # calls them). Blank = the in-cluster backend Service; set it when AOM runs
  # outside the cluster, e.g. http://<node ip>:<backend port>/oc/mcp.
  mcpPublicUrl: ""
  adminUsername: admin
  # Required when aom.enabled. AOM requires 12+ characters, not a common password.
  adminPassword: ""
  # The AOM dashboard as a browser reaches it - linked from the story page (/story).
  dashboardUrl: ""
  # Optional: a key for an agent you registered yourself; blank = self-register.
  agentApiKey: ""
  # Optional: a key for the Returns Agent; blank = self-register.
  returnsAgentApiKey: ""
  verifyTls: false
  # Optional: pin the LLM AOM routes completions to.
  llmProvider: ""
  llmModel: ""

# The mock nightly export of customers, prospects and team members
# (datagen/README.md): generated into a volume on first start (a few seconds
# for 24 MiB) and again every morning by a CronJob, as the real export from
# the systems of record would deliver it. The backend picks up the new
# partition on its own.
nightlyExport:
  targetMb: 24
  parts: 2
  keepPartitions: 2
  # Re-export today's partition on every backend start, even if it is already there.
  # Turn on for one deploy after a catalog change (e.g. new products or groups), then off again.
  forceExportOnStart: false
  persistence:
    size: 2Gi
    storageClassName: ""
  daily:
    enabled: true
    schedule: "0 5 * * *"
    timeZone: America/New_York

web:
  image:
    repository: onechat-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8083
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Small helper image for the wait/init steps.
curlImage: curlimages/curl:8.11.1
